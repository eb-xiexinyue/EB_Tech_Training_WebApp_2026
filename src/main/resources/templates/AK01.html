<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>案件一覧</title>
    <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
<main class="page">
    <section class="card card-list">

        <div class="header-bar">
            <h1>案件一覧</h1>
            <div class="header-actions">
                <button type="button" class="btn btn-primary" onclick="location.href='/addAnken'">新規作成</button>
                <button type="button" class="btn" onclick="location.href='/MAIN'">戻る</button>
            </div>
        </div>

        <div class="table-wrap">
            <table class="tbl">
                <thead>
                <tr>
                    <th>案件ID</th>
                    <th>案件名</th>
                    <th>所属部署</th>
                    <th class="col-center">編集</th>
                    <th class="col-center">削除</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="anken : ${ankens}">
                    <td th:text="${anken.anken_id}"></td>
                    <td th:text="${anken.anken_name}"></td>
                    <td th:text="${anken.department != null ? anken.department.department_name : '未設定'}"></td>

                    <td class="col-center">
                        <button type="button" class="btn btn-sm"
                                th:onclick="'editAnken(' + ${anken.anken_id} + ')'">編集</button>
                    </td>
                    <td class="col-center">
                        <button type="button" class="btn btn-sm"
                                th:onclick="'deleteAnken(' + ${anken.anken_id} + ')'">削除</button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

    </section>
</main>

<script src="/js/AK01.js"></script>
</body>
</html>
