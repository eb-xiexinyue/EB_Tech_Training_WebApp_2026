<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title th:text="${employee.employee_id == null ? '社員新規登録' : '社員情報編集'}"></title>
    <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
<main class="page">
    <section class="card">

        <div class="header-bar">
            <h1 th:text="${employee.employee_id == null ? '社員新規登録' : '社員情報編集'}"></h1>

            <div class="header-actions">
                <button type="submit" class="btn btn-primary" form="employeeForm"
                        th:text="${employee.employee_id == null ? '登録' : '保存'}"></button>
                <button type="button" class="btn" onclick="location.href='/SK01'">戻る</button>
            </div>
        </div>

        <form id="employeeForm" th:action="@{/saveEmployee}" th:object="${employee}" method="post" novalidate>
            <input type="hidden" th:field="*{employee_id}" />

            <div class="form-stack">

                <!-- 名前（必須） -->
                <div class="field">
                    <div class="label">
                        <span>名前</span><span class="required">*</span>
                    </div>
                    <input id="name" class="input" type="text" th:field="*{name}" />
                    <div id="nameError" class="error-text"></div>
                </div>

                <!-- メールアドレス（必須） -->
                <div class="field">
                    <div class="label">
                        <span>メールアドレス</span><span class="required">*</span>
                    </div>
                    <input id="email" class="input" type="text" th:field="*{email}" />

                    <!-- フロント側の必須チェックエラー -->
                    <!-- サーバ側（重複など）エラー表示 -->
                    <div id="emailError"
                         class="error-text"
                         th:text="${errorMsg}">
                    </div>
                </div>

                <!-- 所属部署 -->
                <div class="field">
                    <div class="label">
                        <span>所属部署</span>
                    </div>
                    <select id="departmentId" th:field="*{departmentId}">
                        <option value="">選択してください</option>
                        <option th:each="d : ${departments}"
                                th:value="${d.department_id}"
                                th:text="${d.department_name}">
                        </option>
                    </select>
                    <div class="error-text"></div>
                </div>

                <!-- 所属案件 -->
                <div class="field">
                    <div class="label">
                        <span>所属案件</span>
                    </div>
                    <select id="ankenId" th:field="*{ankenId}">
                        <option value="">選択してください</option>
                        <option th:each="a : ${ankens}"
                                th:value="${a.anken_id}"
                                th:text="${a.anken_name}">
                        </option>
                    </select>
                    <div class="error-text"></div>
                </div>

            </div>
        </form>
    </section>
</main>

<script src="/js/SK02.js"></script>
</body>
</html>
