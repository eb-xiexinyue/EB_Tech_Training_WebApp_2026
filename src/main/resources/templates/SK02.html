<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title th:text="${employee.employee_id == null ? '社員新規登録' : '社員情報編集'}"></title>
	<link rel="stylesheet" href="/css/SK02.css">
</head>
<body>
	<div class="main-area">
		<h1 th:text="${employee.employee_id == null ? '社員新規登録' : '社員情報編集'}"></h1>

		<form th:action="@{/saveEmployee}" th:object="${employee}" method="post" onsubmit="return validateForm()">
			<input type="hidden" th:field="*{employee_id}"/>

			<table class="main-tbl">
				<tr>
					<td class="lbl"><label>名前：</label></td>
					<td class="ipt">
						<input id="name" th:field="*{name}"/>
					</td>
				</tr>

				<tr>
					<td class="lbl"><label>フリガナ：</label></td>
					<td class="ipt">
						<input id="nameKana" th:field="*{nameKana}"/>
					</td>
				</tr>

				<tr>
					<td class="lbl"><label>性別：</label></td>
					<td class="ipt">
						<select id="gender" th:field="*{gender}">
							<option value="">-- 選択してください --</option>
							<option value="1">男性</option>
							<option value="2">女性</option>
							<option value="9">その他</option>
						</select>
					</td>
				</tr>

				<tr>
					<td class="lbl"><label>生年月日：</label></td>
					<td class="ipt">
						<input type="date" id="birthDate" th:field="*{birthDate}"/>
					</td>
				</tr>

				<tr>
					<td class="lbl"><label>メールアドレス：</label></td>
					<td class="ipt">
						<input id="email" th:field="*{email}"/>
					</td>
				</tr>

				<tr>
	<td class="lbl"><label>所属部署：</label></td>
	<td class="ipt">
		<select id="departmentId" th:field="*{departmentId}">
			<option value="">-- 選択してください --</option>
			<option th:each="d : ${departments}"
			        th:value="${d.department_id}"
			        th:text="${d.department_name}">
			</option>
		</select>
	</td>
</tr>

<tr>
	<td class="lbl"><label>所属案件：</label></td>
	<td class="ipt">
		<select id="ankenId" th:field="*{ankenId}">
			<option value="">-- 選択してください --</option>
			<option th:each="a : ${ankens}"
			        th:value="${a.anken_id}"
			        th:text="${a.anken_name}">
			</option>
		</select>
	</td>
</tr>

			</table>

			<div>
				<b id="errorMsg" style="color: red;" th:text="${errorMsg}"></b>
			</div>

			<div>
				<button type="submit" class="btn"
						th:text="${employee.employee_id == null ? '登録' : '保存'}"></button>
				<button type="button" class="btn" onclick="location.href='/SK01'">戻る</button>
			</div>

		</form>
	</div>

	<script src="/js/SK02.js"></script>
</body>
</html>
