<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<h1 th:text="${employee.employee_id == null ? '社員新規登録' : '社員情報編集'}"></h1>
	<form th:action="@{/saveEmployee}" th:object="${employee}" method="post">
		<input type="hidden" th:field="*{employee_id}"/>
		<label>名前：</label><input th:field="*{name}"/>
		<br>
		<label>メールアドレス：</label><input th:field="*{email}"/>
		<br>
		<label>所属部署：</label>
		<select th:field="*{departmentId}">
			<option value="">-- 選択してください --</option>
			<option th:each="d : ${departments}"
					th:value="${d.department_id}"
					th:text="${d.department_name}">
				
			</option>
		</select>
		<br>
		<label>所属案件：</label>
		<select th:field="*{ankenId}">
			<option value="">-- 選択してください --</option>
			<option th:each="a : ${ankens}"
					th:value="${a.anken_id}"
					th:text="${a.anken_name}">
				
			</option>
		</select>
		
		<div>
			<b style="color: red;" th:text="${errorMsg}"></b>
		</div>
		
		<button th:text="${employee.employee_id == null ? '登録' : '保存'}"></button>
		
		<button onclic="location.href='/SK01'">戻る</button>
	</form>
	
	<script src="/js/SK02.js"></script>
</body>
</html>
