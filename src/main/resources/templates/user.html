<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <h1>ユーザー追加</h1>
    <form th:action="@{/saveUser}" th:object="${user}" method="post">
        <input type="hidden" th:field="*{id}"/>
        名前：<input th:field="*{name}"/>
        メールアドレス：<input th:field="*{email}"/>
        <button type="submit">保存</button>
    </form>
</body>
</html>
